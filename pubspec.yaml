name: vahancheck
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # -- STATE MANAGEMENT / ROUTING / DI -----
  get: ^4.6.6

  # -- NETWORKING ---
  dio: ^5.4.3+1

  # -- STORAGE --
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  # -- UI / FONTS --
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8

  # -- UTILS --
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # -- ASSETS ----------------
  # assets/images/
  # assets/icons/
  assets:
    - assets/images/
    - assets/icons/

